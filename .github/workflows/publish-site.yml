name: Publish project site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # daily refresh of the project-update page
  push:
    branches: [main]
    paths:
      - site/**
      - contributors/gerard/workings/contents/replication/export/excel/**
      - contributors/gerard/workings/contents/replication/audit/evidence/**
      - .github/workflows/publish-site.yml

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build model JSON
        run: python site/scripts/build_model.py

      - name: Copy aggregate EDA tables (refuses row-level data)
        run: python site/scripts/build_eda.py

      - name: Fetch GitHub issues for the project-update page
        run: python site/scripts/build_pm.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40

      - name: Render Quarto site
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
